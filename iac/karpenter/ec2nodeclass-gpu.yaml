# Part 5a - node class for GPU inference nodes (Karpenter v1 API, verified
# against karpenter.sh docs v1.15). A dedicated class for accelerated nodes:
# amiSelectorTerms cannot tell GPU from non-GPU AMIs, so GPU nodes get their own
# class (and their own, bigger disk for model weights + CUDA images).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: "KarpenterNodeRole-quote-prod"          # Karpenter manages the instance profile
  amiSelectorTerms:
    # AL2023 alias: Karpenter resolves the NVIDIA variant for GPU instance types.
    # Pin a released version in production (e.g. al2023@vYYYYMMDD) and roll it
    # forward deliberately; `latest` is only acceptable for this exercise.
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: quote-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: quote-prod
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi           # model weights + large CUDA images
        volumeType: gp3
        iops: 6000
        throughput: 500             # fast image pulls shorten cold starts
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1      # pods can't reach IMDS; use Pod Identity / IRSA
    httpTokens: required            # IMDSv2 only
  tags:
    team: ml-platform
    workload: gpu-inference
