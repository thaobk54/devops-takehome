# Part 5a - GPU NodePools: spot preferred, on-demand fallback.
#
# Two pools selecting the same node class. The scheduler tries pools in
# descending `weight`, so Karpenter launches SPOT GPU capacity first and only
# falls back to the on-demand pool when spot is unavailable / insufficient
# (Karpenter caches ICE errors per offering and moves on).
#
# Both pools:
#  - taint nvidia.com/gpu:NoSchedule  -> only pods that tolerate it land here
#  - consolidationPolicy WhenEmpty + consolidateAfter: a node is only removed
#    once NO inference pod runs on it; never "underutilized" bin-packing that
#    would evict a pod mid-request / mid-model-load
#  - disruption budget: at most 1 node at a time, and none during peak hours
#  - terminationGracePeriod bounds how long a draining node may wait for
#    long requests (pods also set karpenter.sh/do-not-disrupt while serving
#    a long batch, which Karpenter honours until that grace period)
#  - limits cap spend if something scales out of control
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  weight: 100                       # tried first
  template:
    metadata:
      labels:
        acme.io/node-type: gpu
        acme.io/capacity: spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      expireAfter: 720h             # rotate nodes monthly (AMI / kernel patches)
      terminationGracePeriod: 2h    # upper bound for draining long inference
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # Diversify across several GPU families/sizes: more spot pools = fewer
        # interruptions and fewer "insufficient capacity" errors.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5", "g6", "g6e", "g4dn"]
          minValues: 2
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1", "4"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m           # absorb short traffic dips without churn
    budgets:
      - nodes: "1"                  # one GPU node at a time
      - nodes: "0"                  # freeze voluntary disruption at peak
        schedule: "0 1 * * mon-fri" # 08:00 ICT (UTC+7)
        duration: 12h
  limits:
    nvidia.com/gpu: "16"
    cpu: "256"
    memory: 2048Gi
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-on-demand
spec:
  weight: 10                        # fallback
  template:
    metadata:
      labels:
        acme.io/node-type: gpu
        acme.io/capacity: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      expireAfter: 720h
      terminationGracePeriod: 2h
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5", "g6", "g6e", "g4dn"]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1", "4"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
      - nodes: "0"
        schedule: "0 1 * * mon-fri"
        duration: 12h
  limits:
    nvidia.com/gpu: "8"             # smaller: on-demand is the expensive safety net
    cpu: "128"
    memory: 1024Gi
