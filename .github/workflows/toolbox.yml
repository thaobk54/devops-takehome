# Publishes the toolbox image used by docker-compose.yml (only when it changes).
name: toolbox
on:
  push:
    branches: [main]
    paths: ["toolbox/**", ".github/workflows/toolbox.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: toolbox
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-toolbox:v1
            ghcr.io/${{ github.repository_owner }}/devops-toolbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
