# quote-api CI/CD  (migrated from ci/legacy.gitlab-ci.yml - see MIGRATION-NOTES.md)
#
#   test ─┐
#         ├─► build (+ Trivy gate, push to GHCR, cosign) ─► gitops-bump (main only)
#   sast ─┘
#
# Deploy is GitOps: CI never touches the cluster. It commits the new immutable
# image tag to charts/quote-api/values.yaml and ArgoCD syncs it.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # least privilege by default; jobs widen only what they need

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/quote-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Unit tests (failures fail the pipeline - no "|| echo")
        working-directory: app
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -v
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Terraform (Part 5b) fmt / init / validate
        run: |
          terraform -chdir=iac/cloudflare fmt -check -recursive
          terraform -chdir=iac/cloudflare init -backend=false -input=false
          terraform -chdir=iac/cloudflare validate
      - name: Static policy tests (chart, Karpenter, Terraform, docs)
        run: |
          pip install pyyaml pytest
          python -m pytest tests/static -v

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (hard gate - any finding fails the job)
        run: >
          semgrep scan --error --metrics=off
          --config p/python --config p/dockerfile --config p/secrets --config p/kubernetes

  build:
    needs: [test, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR with the ephemeral GITHUB_TOKEN
      id-token: write       # keyless cosign signing (OIDC)
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy gate (HIGH/CRITICAL with a fix available)
        # pinned Trivy image instead of a third-party action (smaller supply-chain surface)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          "${IMAGE}:${{ steps.vars.outputs.tag }}"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (immutable git-SHA tag; `latest` only as a convenience pointer)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/amd64,linux/arm64     # reviewers on Apple Silicon too
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
        if: steps.push.outcome == 'success'
      - name: Sign image (keyless, by digest)
        if: steps.push.outcome == 'success'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  gitops-bump:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # commit the new tag
    steps:
      - uses: actions/checkout@v4
      - name: Point the chart at the new image (ArgoCD deploys it)
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${TAG}\"/" charts/quote-api/values.yaml
          git diff --stat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: quote-api ${TAG} [skip ci]" || echo "tag unchanged"
          git push
