{{- if .Values.networkPolicy.enabled }}
# Least privilege: pods accept traffic only on the app port and only from the
# ingress controller / monitoring namespaces. No egress needed at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "quote-api.fullname" . }}
  labels: {{- include "quote-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "quote-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress: []
{{- end }}
